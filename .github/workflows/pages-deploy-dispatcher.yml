name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/pages-deploy-callable.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy_ref: ${{ github.sha }}
